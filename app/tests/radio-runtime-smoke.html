<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>VNM Radio Runtime Smoke Test</title>
</head>
<body>
  <div id="result">loading</div>
  <script>
    (function () {
      function el(tag, cls, html) {
        var node = document.createElement(tag || 'div');
        node.className = cls || '';
        if (html !== undefined) node.innerHTML = html;
        return node;
      }
      fetch('../src/apps/vnm-radio.json').then(function (response) {
        return response.json();
      }).then(function (app) {
        localStorage.setItem('vnm-radio-state-v2', JSON.stringify({
          // Simulate an older saved state whose side-panel flag was not a boolean.
          ui2: { mode: 'bar', view: 'playlists', sidesOpen: null },
          v3Radio: {
            activePlaylistId: 'playlist-test',
            mode: 'recommend',
            playlists: [
              { id: 'now-playing', system: true, name: '正在播放', songs: [] },
              {
                id: 'playlist-test',
                name: '测试歌单',
                cover: 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=',
                songs: [
                  {
                    id: 'rain-test',
                    title: '雨声',
                    artist: '环境音',
                    url: 'about:blank',
                    cover: 'data:image/gif;base64,R0lGODlhAQABAIAAAAD/AP///ywAAAAAAQABAAACAUwAOw==',
                    scriptVersions: [{
                      id: 'song-script-favorite-test',
                      t: 1,
                      label: 'Favorite test',
                      host: 'Host',
                      say: 'Saved script',
                      favorite: false
                    }],
                    advanced: {
                      volumeMode: 'global',
                      volume: 55,
                      duckMode: 'follow',
                      duckVolume: 20,
                      loop: true
                    }
                  },
                  {
                    id: 'latest-without-cover',
                    title: 'No cover',
                    artist: 'Fallback test',
                    url: 'about:blank'
                  }
                ]
              }
            ]
          }
        }));
        var state = {
          characters: [],
          activeCharIds: [],
          user: { name: '测试用户', persona: '' },
          wbEntries: [],
          wbActive: [],
          vnmApps: [],
          presets: [],
          history: {}
        };
        var ctx = {
          sbS: state,
          settings: { autoRequest: false },
          save: function () {},
          toast: function () {},
          div: function (cls, html) { return el('div', cls, html); },
          el: el,
          svg: function () { return ''; },
          fetch: window.fetch.bind(window),
          Audio: window.Audio,
          atob: window.atob.bind(window),
          getChars: function () { return state.characters; },
          getActiveChars: function () { return []; },
          getUser: function () { return state.user; },
          getWbActive: function () { return []; },
          renderTemplate: function (value) { return String(value || ''); },
          back: function () {},
          go: function () {}
        };
        var page = new Function('ctx', 'return (' + app.pageCode + ')(ctx);');
        var root = page(ctx);
        if (!root || root.nodeType !== 1) throw new Error('pageCode did not return a DOM element');
        document.body.appendChild(root);
        var openStudio = document.querySelector('[title="打开第三形态"]');
        if (!openStudio) throw new Error('studio open button is missing');
        openStudio.click();
        setTimeout(function () {
          try {
            var cards = Array.prototype.slice.call(document.querySelectorAll('.vnr2-card'));
            if (cards.length !== 2) throw new Error('expected two studio side cards');
            cards.forEach(function (card) {
              if (card.classList.contains('hidden') || getComputedStyle(card).opacity === '0') {
                throw new Error('studio side card did not open on first entry');
              }
            });
            var playlistCard = document.querySelector('.vnr3-pl-card[data-playlist-id="playlist-test"]');
            var playlistImage = playlistCard && playlistCard.querySelector('.vnr3-pl-cover img');
            if (!playlistImage || playlistImage.getAttribute('src') !==
                'data:image/gif;base64,R0lGODlhAQABAIAAAAD/AP///ywAAAAAAQABAAACAUwAOw==') {
              throw new Error('playlist did not fall back to the newest song with an available cover');
            }
            var engine = window.__vnmRadioEngine;
            playlistCard.click();
            var scriptButton = Array.prototype.slice.call(
              document.querySelectorAll('.vnr3-detail-actions button')
            ).filter(function (button) {
              return button.textContent.trim() === '台本';
            })[0];
            if (!scriptButton) throw new Error('playlist script button is missing');
            scriptButton.click();
            var libraryPicker = document.querySelector('.vnr3-script-layer select');
            if (!libraryPicker || libraryPicker.value !== 'playlist-test') {
              throw new Error('script library did not open on the requested playlist');
            }
            engine.v3.state.continuousVersions.unshift({
              id: 'library-refresh-test',
              playlistId: 'now-playing',
              title: 'Library refresh test',
              createdAt: Date.now(),
              favorite: false,
              nodes: [{ id: 'refresh-speech', type: 'speech', host: 'Host', ttsText: 'Refresh' }]
            });
            engine.v3.uiRefresh({
              scriptLibrary: true,
              playlistId: 'now-playing',
              focusPlaylist: true,
              versionId: 'library-refresh-test'
            });
            libraryPicker = document.querySelector('.vnr3-script-layer select');
            var libraryLayer = document.querySelector('.vnr3-script-layer');
            if (!libraryPicker || libraryPicker.value !== 'now-playing' ||
                !libraryLayer || libraryLayer.textContent.indexOf('Library refresh test') < 0) {
              throw new Error('script library did not refresh and focus the generated script playlist');
            }
            var pauseCalls = 0;
            var companionAudio = {
              paused: false,
              src: 'companion://playing',
              pause: function () { pauseCalls++; this.paused = true; },
              play: function () { this.paused = false; return Promise.resolve(); }
            };
            var companionRuntime = {
              audio: companionAudio,
              paused: false,
              stopped: false
            };
            engine.v3.continuousRuntime = companionRuntime;
            engine.voice = companionAudio;
            engine.running = true;
            engine.current = { id: 'current-test', song: { title: 'Current' } };
            engine.queue = [];
            engine.next();
            if (pauseCalls !== 0 || engine.voice !== companionAudio ||
                engine.v3.continuousRuntime !== companionRuntime) {
              throw new Error('next song interrupted companion audio');
            }
            engine.v3.continuousRuntime = null;
            engine.voice = null;
            engine.running = false;

            var imported = engine.v3.importScripts(JSON.stringify({
              format: 'vnm-radio-scripts',
              version: 1,
              continuousVersions: [{
                id: 'favorite-import-test',
                playlistId: 'playlist-test',
                title: 'Favorite import',
                favorite: true,
                nodes: [{ id: 'speech-import', type: 'speech', host: 'Host', ttsText: 'Hello' }]
              }],
              songScripts: []
            }));
            if (imported.continuousAdded !== 1 ||
                engine.v3.deleteContinuousVersion('favorite-import-test') !== false) {
              throw new Error('favorite imported script was not protected from cleanup');
            }
            var savedSong = engine.v3.playlist('playlist-test').songs[0];
            var favoriteState = engine.v3.toggleSongScriptFavorite(
              { song: savedSong, librarySongId: savedSong.id },
              'song-script-favorite-test'
            );
            if (!favoriteState || !savedSong.scriptVersions[0].favorite) {
              throw new Error('song script favorite was not persisted');
            }
            document.getElementById('result').textContent = 'PASS';
            window.__VNR_SMOKE_RESULT__ = { ok: true, version: app.version };
          } catch (error) {
            document.getElementById('result').textContent = 'FAIL: ' + (error && error.stack || error);
            window.__VNR_SMOKE_RESULT__ = { ok: false, error: String(error && error.stack || error) };
            console.error(error);
          }
        }, 450);
      }).catch(function (error) {
        document.getElementById('result').textContent = 'FAIL: ' + (error && error.stack || error);
        window.__VNR_SMOKE_RESULT__ = { ok: false, error: String(error && error.stack || error) };
        console.error(error);
      });
    })();
  </script>
</body>
</html>
